services:
  app:
    build: .
    container_name: steam-assistant
    ports:
      - "9000:9000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama
    volumes:
      - ./chroma_db:/app/chroma_db

  ollama:
    image: ollama/ollama
    container_name: steam-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data:
